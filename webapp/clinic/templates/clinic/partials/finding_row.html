<li class="finding-row" id="finding-{{ f.feature }}" tabindex="-1"><div><b><span class="factor-rank" aria-hidden="true">{{ rank|stringformat:"02d" }}</span>{{ f.label }}</b><span>{{ f.value }}</span></div><span class="influence-track" aria-hidden="true"><span class="{{ direction }}" style="width:{{ f.pct }}%"></span></span>
{% if f.has_evidence %}<a class="finding-evidence no-print" href="#evidence-{{ f.feature }}">Review {% if f.source_count %}{{ f.source_count }} source{{ f.source_count|pluralize }}{% else %}research summary{% endif %} <span aria-hidden="true">&rarr;</span><span class="visually-hidden"> for {{ f.label }}</span></a>{% else %}<a class="finding-evidence secondary-evidence no-print" href="{% url 'evidence' %}?q={{ f.label|urlencode }}%20IBD">Search literature <span aria-hidden="true">&rarr;</span><span class="visually-hidden"> for {{ f.label }}</span></a>{% endif %}</li>
