{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pagination">
{% if page.has_previous %}<a href="?q={{ q|urlencode }}&amp;risk={{ risk|urlencode }}{% if section %}&amp;section={{ section }}{% endif %}&amp;page={{ page.previous_page_number }}">&larr; Previous</a>{% else %}<span></span>{% endif %}
<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
{% if page.has_next %}<a href="?q={{ q|urlencode }}&amp;risk={{ risk|urlencode }}{% if section %}&amp;section={{ section }}{% endif %}&amp;page={{ page.next_page_number }}">Next &rarr;</a>{% else %}<span></span>{% endif %}</nav>{% endif %}
